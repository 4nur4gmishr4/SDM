name: Sai Darshan Mart CI/CD Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  validate-and-build:
    name: Build, Lint & Smoke Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify TypeScript Types (Strict Mode)
        run: npx tsc -b

      - name: Build Vite Production Bundle
        run: npm run build

      - name: Install Playwright Browsers (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Responsive Verification Test
        run: |
          npx vite preview --port 4173 &
          sleep 4
          node -e "
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 390, height: 844 } });
            await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });
            const title = await page.title();
            console.log('Homepage Title:', title);
            const categories = await page.locator('.category-nav__item').count();
            console.log('Categories count:', categories);
            if (categories < 18) throw new Error('Category count below expected');
            await browser.close();
            console.log('CI Smoke test passed successfully!');
          })().catch(e => {
            console.error(e);
            process.exit(1);
          });
          "
