name: Automated Master Inventory Sync

on:
  schedule:
    # Runs daily at 02:00 UTC (07:30 AM Indian Standard Time) before store opening
    - cron: '0 2 * * *'
  push:
    branches: [ master ]
    paths:
      - 'main_data/**'
      - 'scripts/sync_excel_to_supabase.js'
      - 'scripts/env_loader.js'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual master catalog sync'
        required: false
        default: 'Manual update triggered by store administrator'

jobs:
  sync-inventory:
    name: Sync Master Excel Catalog to Supabase Live
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify Master Excel Catalog File Exists
        run: |
          if [ ! -f "main_data/ALL PRODUCT LIST.xlsx" ]; then
            echo "❌ Error: Master Excel file main_data/ALL PRODUCT LIST.xlsx not found."
            exit 1
          fi
          echo "✅ Master catalog file confirmed ($(ls -lh "main_data/ALL PRODUCT LIST.xlsx" | awk '{print $5}'))"

      - name: Execute Excel to Supabase Sync Engine
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://otyojqnnwbrteknyqcpi.supabase.co' }}
        run: node scripts/sync_excel_to_supabase.js
