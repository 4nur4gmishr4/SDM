    <!-- Early Theme Initializer: guarantees exact data-theme is set before first render -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('sdm-theme');
          var systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = saved ? saved === 'dark' : systemDark;
          var resolved = isDark ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', resolved);
          document.documentElement.setAttribute('data-theme-mode', saved || 'system');
        } catch (e) {}
      })();
    </script>

    <!-- Icon Font Pre-render Guard: hides raw ligature words until the icon font is ready -->
    <script>
      (function() {
        if ('fonts' in document) {
          document.documentElement.classList.add('icons-loading');
          document.fonts.load('24px "Material Symbols Outlined"').then(function() {
            document.documentElement.classList.remove('icons-loading');
          }).catch(function() {
            document.documentElement.classList.remove('icons-loading');
          });
          // Fallback timeout: never block longer than 300ms
          setTimeout(function() {
            document.documentElement.classList.remove('icons-loading');
          }, 300);
        }
      })();
    </script>
