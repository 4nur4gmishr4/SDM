<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sai Darshan Mart — Your local supermarket in Jabalpur. Browse products, place orders via WhatsApp. There is only one Boss: The Customer." />

    <!-- Google Fonts & CDN Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Preload Material Symbols font directly to eliminate FOUT/icon word flashing -->
    <link 
      rel="preload" 
      href="https://fonts.gstatic.com/s/materialsymbolsoutlined/v374/kJEPBvYX7BgnkSrUwT8OhrdQw4oELdPIeeII9v6oDMzBwG-RpA6RzaxHMPdY40yxrjGyv3fzdVBO1Q.woff2" 
      as="font" 
      type="font/woff2" 
      crossorigin 
    />

    <!-- Google Fonts: Roboto & Material Symbols (display=block prevents text words from flashing) -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0..1,0&display=block" />

    <!-- Early Theme Initializer: guarantees exact data-theme is set before first render -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('sdm-theme');
          var isDark = saved === 'dark' || (saved !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var resolved = isDark ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', resolved);
          document.documentElement.setAttribute('data-theme-mode', saved || 'system');
        } catch (e) {}
      })();
    </script>

    <!-- Icon Font Pre-render Guard: hides raw ligature words until the icon font is ready -->
    <script>
      (function() {
        if ('fonts' in document) {
          document.documentElement.classList.add('icons-loading');
          document.fonts.load('24px "Material Symbols Outlined"').then(function() {
            document.documentElement.classList.remove('icons-loading');
          }).catch(function() {
            document.documentElement.classList.remove('icons-loading');
          });
          // Fallback timeout: never block longer than 400ms
          setTimeout(function() {
            document.documentElement.classList.remove('icons-loading');
          }, 400);
        }
      })();
    </script>

    <title>Sai Darshan Mart — Local Supermarket, Jabalpur</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
