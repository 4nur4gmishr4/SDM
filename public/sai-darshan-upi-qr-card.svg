<?xml version="1.0" encoding="UTF-8"?>
<svg width="640" height="980" viewBox="0 0 640 980" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="320" y1="0" x2="320" y2="980" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B3A1C" />
      <stop offset="35%" stop-color="#13562A" />
      <stop offset="100%" stop-color="#082412" />
    </linearGradient>
    <linearGradient id="headerGold" x1="0" y1="0" x2="640" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E37400" />
      <stop offset="50%" stop-color="#F9AB00" />
      <stop offset="100%" stop-color="#E37400" />
    </linearGradient>
    <linearGradient id="glassCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F6FAF7" />
    </linearGradient>
    <filter id="cardShadow" x="-20" y="-10" width="680" height="1000" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.35" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.2" />
    </filter>
    <filter id="qrShadow" x="40" y="260" width="560" height="560" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.12" />
    </filter>
  </defs>
  <style>
    .font-brand { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 800; }
    .font-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 500; }
    .font-bold { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 700; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-weight: 700; }
  </style>

  <!-- Outer Shell -->
  <rect width="640" height="980" rx="36" fill="url(#bgGrad)" />
  <rect x="0" y="0" width="640" height="8" rx="4" fill="url(#headerGold)" />

  <!-- Header: Bank Partner & Merchant Details -->
  <g transform="translate(0, 36)">
    <!-- Bank & Verified Badge -->
    <rect x="180" y="0" width="280" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.12" stroke="#81C995" stroke-opacity="0.4" stroke-width="1.2" />
    <text x="320" y="18" text-anchor="middle" fill="#CEEAD6" class="font-sub" font-size="11.5" letter-spacing="1.2">ICICI BANK POS VERIFIED MERCHANT</text>

    <!-- Legal Merchant Name -->
    <text x="320" y="60" text-anchor="middle" fill="#FFFFFF" class="font-brand" font-size="24" letter-spacing="0.6">M/S. SAI DARSHAN SHOPPING MART</text>
    
    <!-- Subtitle / Location -->
    <text x="320" y="84" text-anchor="middle" fill="#A8DAB5" class="font-sub" font-size="12.5" letter-spacing="0.5">1117 Sanjeevni Nagar, Jabalpur • Fresh Groceries &amp; Supermarket</text>
  </g>

  <!-- Main Standee White Plaque -->
  <rect x="44" y="145" width="552" height="690" rx="28" fill="url(#glassCard)" filter="url(#cardShadow)" />

  <!-- Standee Header Stripe -->
  <g transform="translate(44, 145)">
    <path d="M 0 28 Q 0 0 28 0 L 524 0 Q 552 0 552 28 L 552 64 L 0 64 Z" fill="#E6F4EA" />
    <text x="276" y="38" text-anchor="middle" fill="#0D652D" class="font-brand" font-size="18" letter-spacing="2.5">SCAN AND PAY</text>
    <text x="276" y="54" text-anchor="middle" fill="#1E8E3E" class="font-sub" font-size="11">Instant Zero-Fee Payment via Any UPI App</text>
  </g>

  <!-- QR Code Inner Box -->
  <rect x="84" y="225" width="472" height="472" rx="20" fill="#FFFFFF" stroke="#D3E3D8" stroke-width="1.5" />

  <!-- QR Code Image -->
  <image x="96" y="237" width="448" height="448" href="data:image/png;base64," preserveAspectRatio="xMidYMid meet" />

  <!-- Center SDSM Verified Merchant Chip -->
  <g transform="translate(282, 423)">
    <rect x="-2" y="-2" width="80" height="80" rx="20" fill="#FFFFFF" stroke="#1E8E3E" stroke-width="3" filter="url(#qrShadow)" />
    <rect x="6" y="6" width="64" height="64" rx="16" fill="#1E8E3E" />
    <text x="38" y="45" text-anchor="middle" fill="#FFFFFF" class="font-brand" font-size="22" letter-spacing="0.5">SDSM</text>
  </g>

  <!-- POS Reference Side Tag -->
  <g transform="translate(44, 706)">
    <text x="276" y="0" text-anchor="middle" fill="#5F6368" class="font-sub" font-size="11.5" letter-spacing="0.6">POS-linked Static QR / EP116181</text>
  </g>

  <!-- Official UPI ID Pill Container -->
  <g transform="translate(74, 725)">
    <rect x="0" y="0" width="492" height="52" rx="26" fill="#E8F0FE" stroke="#1A73E8" stroke-opacity="0.3" stroke-width="1.5" />
    <text x="24" y="32" fill="#174EA6" class="font-bold" font-size="12.5">UPI ID:</text>
    <text x="246" y="33" text-anchor="middle" fill="#174EA6" class="font-mono" font-size="17" letter-spacing="0.8">ibkPOS.EP116181@icici</text>
  </g>

  <!-- Phone / UPI Number Secondary Pill -->
  <g transform="translate(74, 786)">
    <rect x="0" y="0" width="492" height="36" rx="18" fill="#F1F3F4" />
    <text x="246" y="23" text-anchor="middle" fill="#3C4043" class="font-sub" font-size="12">Or Pay via Phone / UPI No: <tspan class="font-bold" fill="#0D652D">+91 73541 55669</tspan></text>
  </g>

  <!-- Bottom Payment Ecosystem Badges -->
  <g transform="translate(0, 856)">
    <!-- BHIM UPI Logo representation -->
    <g transform="translate(90, 0)">
      <rect width="90" height="32" rx="8" fill="#FFFFFF" fill-opacity="0.15" />
      <text x="45" y="21" text-anchor="middle" fill="#FFFFFF" class="font-brand" font-size="12.5" letter-spacing="1">BHIM UPI</text>
    </g>

    <!-- GPay -->
    <g transform="translate(192, 0)">
      <rect width="70" height="32" rx="8" fill="#FFFFFF" fill-opacity="0.15" />
      <text x="35" y="21" text-anchor="middle" fill="#FFFFFF" class="font-brand" font-size="12">G Pay</text>
    </g>

    <!-- PhonePe -->
    <g transform="translate(272, 0)">
      <rect width="80" height="32" rx="8" fill="#FFFFFF" fill-opacity="0.15" />
      <text x="40" y="21" text-anchor="middle" fill="#FFFFFF" class="font-brand" font-size="12">PhonePe</text>
    </g>

    <!-- Paytm -->
    <g transform="translate(362, 0)">
      <rect width="70" height="32" rx="8" fill="#FFFFFF" fill-opacity="0.15" />
      <text x="35" y="21" text-anchor="middle" fill="#FFFFFF" class="font-brand" font-size="12">Paytm</text>
    </g>

    <!-- CRED / iMobile -->
    <g transform="translate(442, 0)">
      <rect width="108" height="32" rx="8" fill="#FFFFFF" fill-opacity="0.15" />
      <text x="54" y="21" text-anchor="middle" fill="#FFFFFF" class="font-brand" font-size="11.5">CRED • iMobile</text>
    </g>
  </g>

  <!-- Footer Trust Note -->
  <text x="320" y="935" text-anchor="middle" fill="#81C995" class="font-sub" font-size="11.5" letter-spacing="0.5">
    Official ICICI Bank POS Terminal EP116181 • 100% Secure Direct Settlement
  </text>
  <text x="320" y="955" text-anchor="middle" fill="#A8DAB5" class="font-sub" font-size="10.5" fill-opacity="0.7">
    Sai Darshan Shopping Mart • There is only one Boss: The Customer
  </text>
</svg>
